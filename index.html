<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Shim window.fetch with a setter to prevent extension interceptor errors (e.g. "Cannot set property fetch of #<Window> which has only a getter")
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if already configurable
        }

        // Prevent external browser extension errors and Vite HMR WebSocket closed errors from causing unhandled crashes
        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          var file = (event && event.filename) || '';
          if (
            file.indexOf('chrome-extension://') !== -1 ||
            file.indexOf('@vite/client') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('fetch') !== -1
          ) {
            event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
            return true;
          }
        }, true);

        // Catch unhandled WebSocket rejections from @vite/client
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var str = '';
          if (typeof reason === 'string') {
            str = reason;
          } else if (reason && typeof reason === 'object') {
            str = (reason.message || '') + ' ' + (reason.stack || '');
          }
          if (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('chrome-extension://') !== -1
          ) {
            event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') {
              event.preventDefault();
            }
          }
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniManage Hub</title>
    <meta name="description" content="Full-stack Enterprise Management Suite with dynamic database schemas, staff, project, inventory & task management, real-time REST API backend, ERD schema studio, and analytics." />
